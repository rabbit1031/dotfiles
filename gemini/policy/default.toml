# ==========================================
# Gemini CLI Policy Rules
# ==========================================
# 💡 Note: The higher the `priority` value, the higher the priority.
# In case of conflicting rules, this value determines the evaluation order.
# see: https://geminicli.com/docs/reference/policy-engine/#priority-system-and-tiers

# ==========================================
# Allow Rules (action = "allow")
# ==========================================

# Allow read-only Git operations and commit operations
[[rules]]
toolName = "run_shell_command"
commandRegex = "^git (status|log|diff|branch|show|ls-files|commit).*$"
action = "allow"
priority = 100

# Allow safe file listing commands
[[rules]]
toolName = "run_shell_command"
commandRegex = "^(ls|tree)($| .*)"
action = "allow"
priority = 100

# Allow specific Gradle tasks
[[rules]]
toolName = "run_shell_command"
commandRegex = "^\\./gradlew (tasks|dependencies|projects|properties|--version|test)$"
action = "allow"
priority = 100

# ==========================================
# Ask User Rules (action = "ask_user")
# ==========================================

# Require confirmation for specific Git operations that involve state changes (add, push, amend, etc.)
[[rules]]
toolName = "run_shell_command"
commandRegex = "^git (add|push|commit.*--amend).*$"
action = "ask_user"
priority = 200

# ==========================================
# Deny Rules (action = "deny")
# ==========================================

# Deny destructive Git operations (force push, hard reset, etc.)
[[rules]]
toolName = "run_shell_command"
commandRegex = "^git (push.*-f|reset --hard.*|clean -fd.*)$"
action = "deny"
priority = 300

# Uniformly deny file deletion operations such as the rm command
[[rules]]
toolName = "run_shell_command"
commandPrefix = "rm "
action = "deny"
priority = 300

# Deny direct access to sensitive information
[[rules]]
toolName = "run_shell_command"
commandRegex = "^(cat ~/.ssh/.*|env|printenv)$"
action = "deny"
priority = 300
